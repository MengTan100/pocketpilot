# SPDX-License-Identifier: MIT
name: 功能建议
description: 提出一个新功能或改进建议（手机端 App / 电脑端桥接 / DSH 插件）
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说清「**你想解决什么问题**」，再说「你希望怎么解决」——
        很多时候问题本身有更简单的解法，直接从方案聊起容易走进死胡同。

        如果你想自己动手实现，欢迎先看 [CONTRIBUTING.md](https://github.com/MengTan100/pocketpilot/blob/main/CONTRIBUTING.md)。
  - type: dropdown
    id: component
    attributes:
      label: 相关部分
      options:
        - 手机端 App（PocketPilot）
        - 电脑端桥接（pc/bridge.js）
        - DSH 插件（侧栏「手机连接」入口 / 配对二维码）
        - 文档 / 发布页
        - 不确定 / 其它
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 你现在是怎么做的？哪里别扭、慢、或者做不到？
      placeholder: 每次……的时候，我都得……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你建议的做法
      description: 具体到"界面上会看到什么、点哪里、发生什么"，越具体越好
      placeholder: 我希望……的时候，可以……
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 比如用其它工具、手工绕过、改配置等；没有就写「无」
    validations:
      required: false
  - type: dropdown
    id: connection
    attributes:
      label: 主要使用的连接方式
      description: 有助于判断这个需求该在哪一端实现
      options:
        - 局域网（明文 HTTP）
        - 隧道（HTTPS）
        - 两种都用
        - 还没用起来
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 与 Discussions，确认不是重复建议
          required: true
        - label: 我理解这个项目是独立第三方项目，与 DeepSeek 官方无关
          required: false
